#{extends 'main.html' /}
#{set title:'Listagem de Pacientes' /}



<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="m-0">Pacientes</h1>
    <a href="@{Pacientes.form}" class="btn btn-success">+ Novo Paciente</a>
</div>

<form action="@{Pacientes.listar}" class="d-flex mb-4" role="search">
    <input type="text" name="termo" value="${termo}" placeholder="Informe o nome ou email" class="form-control me-2" />
    <button type="submit" class="btn btn-outline-primary">Buscar</button>
</form>

<div class="row">
#{list items:pacientes, as:'p'}
    <div class="col-md-6 col-lg-4 mb-3">
        <div class="card shadow-sm h-100">
            <div class="card-body">
                <h5 class="card-title">${p.nome}</h5>

                <div class="d-flex gap-2 mt-3">
                    <a href="@{Pacientes.editar(p.id)}" class="btn btn-sm btn-secondary">Editar</a>
                    <a href="@{Pacientes.detalhar(p.id)}" class="btn btn-sm btn-primary">Detalhar</a>
                    #{if session['perfilUsuario'] == 'ADMIN'}
    <a href="@{Pacientes.remover(p.id)}" class="btn btn-sm btn-danger"
       onclick="return confirm('Remover este paciente?')">Remover</a>
#{/if}
                </div>
            </div>
        </div>
    </div>
#{/list}
#{else}
    <div class="col-12">
        <p class="text-muted">Nenhum paciente cadastrado.</p>
    </div>
#{/else}
</div>
