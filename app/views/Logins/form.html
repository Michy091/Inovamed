#{extends 'main.html' /}
#{set title:'InovaMed - Login' /}

<div class="login-shell">
	<aside class="login-aside">
		<span class="brand"><span class="brand-mark">+</span>InovaMed</span>
		<div>
			<h2>Pacientes, médicos e consultas em um só lugar.</h2>
			<p>Cada usuário acessa apenas o que o seu perfil permite.</p>
		</div>
	</aside>

	<div class="login-form">
		<h1>Entrar</h1>
		<p class="text-muted mb-4">Informe seu login e senha para acessar o sistema.</p>

		<form action="@{Logins.logar}" method="post">
			<div class="mb-3">
				<label class="form-label" for="login">Login</label>
				<input type="text" id="login" name="login" value="${flash.login}" class="form-control" autocomplete="username" autofocus />
			</div>

			<div class="mb-3">
				<label class="form-label" for="senha">Senha</label>
				<input type="password" id="senha" name="senha" class="form-control" autocomplete="current-password" />
			</div>

			<button type="submit" class="btn btn-primary">Entrar</button>
		</form>
	</div>
</div>
