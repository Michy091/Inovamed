#{extends 'main.html' /}
#{set title:'InovaMed - Login' /}

<div class="row justify-content-center">
	<div class="col-md-5 col-lg-4">
		<div class="card shadow-sm">
			<div class="card-body p-4">
				<h1 class="h3 mb-1">Entrar</h1>
				<p class="text-muted mb-4">Acesse o sistema de gestão clínica.</p>

				<form action="@{Logins.logar}" method="post">
					<div class="mb-3">
						<label class="form-label" for="login">Login</label>
						<input type="text" id="login" name="login" value="${flash.login}" class="form-control" autofocus />
					</div>

					<div class="mb-3">
						<label class="form-label" for="senha">Senha</label>
						<input type="password" id="senha" name="senha" class="form-control" />
					</div>

					<button type="submit" class="btn btn-primary w-100">Entrar</button>
				</form>
			</div>
		</div>
	</div>
</div>
