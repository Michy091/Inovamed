#{extends 'main.html' /}

#{set title:'Cadastro de Médico' /}

#{if p?.id}

    <h1>Edição de Médico</h1>

#{/if}

#{else}

    <h1>Cadastro de Médico</h1>

#{/else}

<hr />

<form action="/medicos/salvar" method="post" class="col-md-6">

    <input type="hidden" name="medico.id" value="${p.id}" />

    <div class="mb-3">

        <label class="form-label">Nome</label>

        <input type="text" name="medico.nome" value="${p.nome}" placeholder="Nome" class="form-control"/>

        <div class="text-danger mt-1">#{error 'medico.nome' /}</div>

    </div>

    <div class="mb-3">

        <label class="form-label">Email</label>

        <input type="email" name="medico.email" value="${p.email}" placeholder="Email" class="form-control"/>

        <div class="text-danger mt-1">#{error 'medico.email' /}</div>

    </div>

    <div class="mb-3">

        <label class="form-label">Data de Nascimento</label>

        <input type="date"
               name="medico.nascimento"
               value="${p.nascimento?.format('yyyy-MM-dd')}"
               class="form-control"/>

        <div class="text-danger mt-1">#{error 'medico.nascimento' /}</div>

    </div>

    <div class="mb-3">

        <label class="form-label">CRM</label>

        <input type="text"
               name="medico.crm"
               value="${p.crm}"
               placeholder="Crm"
               class="form-control"/>

        <div class="text-danger mt-1">#{error 'medico.crm' /}</div>

    </div>

    <div class="mb-3">

        <label class="form-label">Especialidade</label>

        <select name="medico.especialidade.id" class="form-select">

            #{list items:especialidades, as:'d'}

                <option value="${d.id}" ${d.id == p.especialidade?.id ? 'selected' : ''}>

                    ${d.nome}

                </option>

            #{/list}

        </select>

    </div>

    <button type="submit" class="btn btn-primary">Salvar</button>

    <a href="@{Medicos.listar}" class="btn btn-outline-secondary">Cancelar</a>

</form>
